  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

dy>\n\n\n<header class=\"hero\">\n  <div class=\"brand\">\n    <svg viewBox=\"0 0 1024 1024\" aria-hidden=\"true\">\n      <rect width=\"1024\" height=\"1024\" fill=\"#0A0A0B\"><\u002Frect>\n      <path d=\"M172 600 A340 340 0 0 1 852 600\" fill=\"none\" stroke=\"#26262A\" stroke-width=\"64\" stroke-linecap=\"round\"><\u002Fpath>\n      <path d=\"M172 600 A340 340 0 0 1 852 600\" fill=\"none\" stroke=\"#F97316\" stroke-width=\"64\" stroke-linecap=\"round\" stroke-dasharray=\"1068.14\" stroke-dashoffset=\"356.05\"><\u002Fpath>\n      <text x=\"512\" y=\"675\" text-anchor=\"middle\" font-family=\"Chakra Petch, system-ui, sans-serif\" font-weight=\"700\" font-size=\"242\" fill=\"#F0EFEC\">A<\u002Ftext>\n    <\u002Fsvg>\n    <span>ACCELERATOS<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"hero-body\">\n    <div>\n      <p class=\"eyebrow\">DOCUMENT<\u002Fp>\n      <h1>TERMS OF USE<\u002Fh1>\n      <p class=\"meta\">Acceleratos · Effective date: October 27, 2026<\u002Fp>\n    <\u002Fdiv>\n    <svg class=\"hero-arc\" viewBox=\"0 0 340 196\" aria-hidden=\"true\">\n      <path d=\"M28 186 A142 142 0 0 1 312 186\" style=\"stroke: var(--track)\"><\u002Fpath>\n      <path d=\"M28 186 A142 142 0 0 1 312 186\" stroke-linecap=\"round\" stroke-dasharray=\"446.1\" stroke-dashoffset=\"148.7\" style=\"stroke: var(--accent)\"><\u002Fpath>\n    <\u002Fsvg>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"wrap\">\n<aside>\n  <nav class=\"chips\" aria-label=\"Language / Язык\"><a class=\"chip\" href=\"#en\" data-lang=\"en\" aria-current=\"true\">English<\u002Fa><a class=\"chip\" href=\"#ru\" data-lang=\"ru\">Русский<\u002Fa><\u002Fnav>\n  <nav class=\"toc\" aria-label=\"Contents\">\n    <p class=\"toc-title\" id=\"toc-title\">CONTENTS<\u002Fp>\n    <ol id=\"toc\"><\u002Fol>\n  <\u002Fnav>\n<\u002Faside>\n<main>\n<section id=\"en\">\n\n<p>These Terms of Use (the “Terms”) govern your use of the Acceleratos mobile application (the “Application”) provided by [developer name] (“we” or “us” or “our” or the “Developer”) to the individual who installs the Application (“user” or “you”). Please read these Terms carefully. By installing, opening or using the Application, you confirm that you have read, understood and accepted these Terms in full. IF YOU DO NOT AGREE WITH THE TERMS OF USE, PLEASE STOP USING AND DELETE THE APPLICATION.<\u002Fp>\n<p>You confirm that you have reached the age at which you are legally permitted to drive a car and enter into agreements of this kind under the laws of your country, or that you use the Application in demo mode only, with the consent of a legal guardian.<\u002Fp>\n<p>We reserve the right to make changes to these Terms at any time. A new version takes effect once it is published at the same address. You are encouraged to periodically review these Terms to stay informed of updates. Your continued use of the Application after a revised version is posted means that you accept it.<\u002Fp>\n<p>These Terms supplement the <a href=\"https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\">Apple Standard EULA<\u002Fa>. In case of conflict, these Terms apply to the extent permitted by the App Store rules.<\u002Fp>\n\n<h2>DESCRIPTION OF THE APPLICATION<\u002Fh2>\n<p>The Application is designed to measure a car’s acceleration time, and includes the following features and conditions:<\u002Fp>\n\n<h3>Acceleration Measurement<\u002Fh3>\n<p>The Application estimates a car’s acceleration time (for example, 0–100 km/h) using your device’s GPS and motion sensors, and shows a speed graph, split times and a history of runs.<\u002Fp>\n\n<h3>Demo Mode<\u002Fh3>\n<p>Demo mode shows a simulated run without any movement of the car. Results of demo runs are not measurements and are marked “DEMO”.<\u002Fp>\n\n<h3>Cost and Changes<\u002Fh3>\n<p>The Application is provided free of charge, with no registration, ads or in-app purchases. We may change, add or remove features of the Application in updates.<\u002Fp>\n\n<h3>Intended Use<\u002Fh3>\n<p>The Application is intended for personal, non-commercial entertainment use only. It is not a certified measuring instrument, a competition timing device or a vehicle diagnostic tool.<\u002Fp>\n\n<h2>SAFETY<\u002Fh2>\n<p>By using the Application, you agree to follow these rules:<\u002Fp>\n<ol>\n  <li>Perform runs only on closed courses, tracks and other places where such runs are permitted and safe. You must not use the Application for measurements on public roads.<\u002Fli>\n  <li>Obey traffic laws, venue rules and applicable law, and drive only a roadworthy vehicle and only when you are fit to drive.<\u002Fli>\n  <li>Mount your device securely in a holder before the vehicle starts moving.<\u002Fli>\n  <li>Do not interact with the Application or look at the screen while the vehicle is moving; check the result only after coming to a complete stop.<\u002Fli>\n<\u002Fol>\n<p>The Application does not encourage speeding, racing or reckless driving. You alone decide whether, where and how to perform a run and are solely responsible for it, including for any harm to the life, health or property of yourself and third parties, as well as for fines and other penalties.<\u002Fp>\n\n<h2>ACCURACY AND DISCLAIMER OF WARRANTIES<\u002Fh2>\n<p>Results are estimates. Their accuracy depends on GPS signal quality, device model, mounting method, terrain, weather and other factors outside our control.<\u002Fp>\n<p>The Application is provided “as is”. To the maximum extent permitted by law, we make no warranties of any kind, express or implied, including warranties of accuracy, uninterrupted operation, freedom from errors and fitness for a particular purpose.<\u002Fp>\n<p>Results must not be used as official data for competitions, for legal or insurance purposes, as evidence of driving speed, or to assess the technical condition of a vehicle.<\u002Fp>\n\n<h2>LIMITATION OF LIABILITY<\u002Fh2>\n<p>To the maximum extent permitted by law, we are not liable for any direct, indirect, incidental or other damages arising from the use of or inability to use the Application, including accidents, injuries, damage to a vehicle or device, fines and data loss.<\u002Fp>\n<p>The limitations in this section do not apply to the extent that applicable law (including consumer protection law) prohibits excluding or limiting liability.<\u002Fp>\n<p>You agree to indemnify us against third-party claims arising from your breach of the “Safety” section or of the law.<\u002Fp>\n\n<h2>YOUR DATA AND PRIVACY<\u002Fh2>\n\n<h3>Location and Motion Data<\u002Fh3>\n<p>The Application uses location and motion data only to measure acceleration runs. Location access is requested when you first start a run, and you may revoke it in your device’s settings.<\u002Fp>\n\n<h3>Data Storage<\u002Fh3>\n<p>Results and run records are stored only on your device and are never sent to us or to third parties. The Application has no analytics, ads or tracking.<\u002Fp>\n\n<h3>Data Deletion<\u002Fh3>\n<p>You can delete individual runs in the “History” section, or all data by deleting the Application. We have no access to this data and cannot restore it.<\u002Fp>\n\n<p>For more details, see our <a href=\"https://example.com/acceleratos/privacy\">Privacy Policy<\u002Fa>.<\u002Fp>\n\n<h2>LICENSE AND INTELLECTUAL PROPERTY<\u002Fh2>\n<p>We grant you a limited, non-exclusive, revocable, non-transferable license to use the Application on Apple devices that you own or control, as permitted by the App Store rules. All rights in the Application, its code, design, name and logo belong to us.<\u002Fp>\n<p>You may not:<\u002Fp>\n<ol>\n  <li>Copy, modify, decompile or attempt to obtain the source code of the Application, except as expressly permitted by law.<\u002Fli>\n  <li>Sell, rent or distribute the Application.<\u002Fli>\n  <li>Use the Application in violation of the law or of the “Safety” section of these Terms.<\u002Fli>\n<\u002Fol>\n\n<h2>APPLE PROVISIONS<\u002Fh2>\n<p>These Terms are between you and us, not ния. Оно не является сертифицированным измерительным прибором, средством хронометража соревнований или средством диагностики автомобиля.<\u002Fp>\n\n<h2>БЕЗОПАСНОСТЬ<\u002Fh2>\n<p>Используя Приложение, вы обязуетесь соблюдать следующие правила:<\u002Fp>\n<ol>\n  <li>Проводить замеры только на закрытых площадках, треках и других местах, где такие заезды разрешены и безопасны. Запрещается использовать Приложение для замеров на дорогах общего пользования.<\u002Fli>\n  <li>Соблюдать правила дорожного движения, правила площадки и применимое законодательство, а также управлять только исправным автомобилем и в состоянии, допускающем управление.<\u002Fli>\n  <li>Надёжно закреплять устройство в держателе до начала движения.<\u002Fli>\n  <li>Не взаимодействовать с Приложением и не смотреть на экран во время движения; результат следует смотреть после полной остановки.<\u002Fli>\n<\u002Fol>\n<p>Приложение не побуждает к превышению скорости, гонкам или рискованному вождению. Решение о проведении замера, выбор места и способа его проведения вы принимаете самостоятельно и несёте за него полную ответственность, в том числе за вред жизни, здоровью и имуществу себя и третьих лиц, а также за штрафы и иные санкции.<\u002Fp>\n\n<h2>ТОЧНОСТЬ И ОТКАЗ ОТ ГАРАНТИЙ<\u002Fh2>\n<p>Результаты замеров носят оценочный характер. Их точность зависит от качества сигнала GPS, модели устройства, способа крепления, рельефа, погоды и других факторов, которые мы не контролируем.<\u002Fp>\n<p>Приложение предоставляется «как есть» (as is). В максимальной степени, допустимой законом, мы не даём никаких гарантий, явных или подразумеваемых, в том числе гарантий точности, бесперебойной работы, отсутствия ошибок и пригодности для определённой цели.<\u002Fp>\n<p>Результаты замеров не могут использоваться как официальные данные для соревнований, судебных или страховых целей, доказательств скорости движения или оценки технического состояния автомобиля.<\u002Fp>\n\n<h2>ОГРАНИЧЕНИЕ ОТВЕТСТВЕННОСТИ<\u002Fh2>\n<p>В максимальной степени, допустимой законом, мы не несём ответственности за прямой, косвенный, случайный или иной ущерб, возникший в связи с использованием или невозможностью использования Приложения, в том числе за ДТП, травмы, повреждение автомобиля или устройства, штрафы и потерю данных.<\u002Fp>\n<p>Ограничения этого раздела не применяются в той части, в которой применимое законодательство (в том числе о защите прав потребителей) запрещает исключать или ограничивать ответственность.<\u002Fp>\n<p>Вы соглашаетесь возместить нам убытки по претензиям третьих лиц, возникшим из-за нарушения вами раздела «Безопасность» или законодательства.<\u002Fp>\n\n<h2>ВАШИ ДАННЫЕ И КОНФИДЕНЦИАЛЬНОСТЬ<\u002Fh2>\n\n<h3>Геолокация и датчики движения<\u002Fh3>\n<p>Приложение использует геопозицию и датчики движения только для замера разгона. Доступ к геопозиции запрашивается при первом запуске замера, и вы можете отозвать его в настройках вашего устройства.<\u002Fp>\n\n<h3>Хранение данных<\u002Fh3>\n<p>Результаты и записи замеров хранятся только на вашем устройстве и не передаются нам или третьим лицам. Приложение не использует аналитику, рекламу и отслеживание.<\u002Fp>\n\n<h3>Удаление данных<\u002Fh3>\n<p>Вы можете удалить отдельные замеры в разделе «История» или все данные, удалив Приложение. Мы не имеем доступа к этим данным и не можем их восстановить.<\u002Fp>\n\n<p>Подробнее — в нашей <a href=\"https://example.com/acceleratos/privacy\">Политике конфиденциальности<\u002Fa>.<\u002Fp>\n\n<h2>ЛИЦЕНЗИЯ И ИНТЕЛЛЕКТУАЛЬНАЯ СОБСТВЕННОСТЬ<\u002Fh2>\n<p>Мы предоставляем вам ограниченную, неисключительную, отзывную и непередаваемую лицензию на использование Приложения на устройствах Apple, которыми вы владеете или которые контролируете, в соответствии с правилами App Store. Все права на Приложение, его код, дизайн, название и логотип принадлежат нам.<\u002Fp>\n<p>Вам запрещается:<\u002Fp>\n<ol>\n  <li>Копировать, изменять, декомпилировать или пытаться получить исходный код Приложения, кроме случаев, прямо разрешённых законом.<\u002Fli>\n  <li>Продавать, сдавать в аренду или распространять Приложение.<\u002Fli>\n  <li>Использовать Приложение с нарушением закона или раздела «Безопасность» настоящего Соглашения.<\u002Fli>\n<\u002Fol>\n\n<h2>ПОЛОЖЕНИЯ ОБ APPLE<\u002Fh2>\n<p>Настоящее Соглашение заключается между вами и нами, а не с Apple Inc. («Apple»). За Приложение и его содержание отвечаем мы.<\u002Fp>\n<p>Apple не обязана оказывать поддержку и обслуживание Приложения. Apple не отвечает по претензиям, связанным с Приложением, в том числе об ответственности за продукцию, несоответствии требованиям законодательства, защите прав потребителей и нарушении прав интеллектуальной собственности.<\u002Fp>\n<p>Apple и её дочерние компании являются третьими лицами-бенефициарами настоящего Соглашения и вправе требовать его исполнения от вас.<\u002Fp>\n<p>Вы подтверждаете, что не находитесь в стране, находящейся под эмбарго правительства США, и не включены в списки лиц, в отношении которых правительство США ввело ограничения.<\u002Fp>\n\n<h2>СРОК ДЕЙСТВИЯ И ПРЕКРАЩЕНИЕ<\u002Fh2>\n<p>Соглашение действует до удаления Приложения вами. При нарушении Соглашения лицензия прекращается автоматически. Разделы «Безопасность», «Точность и отказ от гарантий», «Ограничение ответственности» и «Положения об Apple» сохраняют силу после прекращения.<\u002Fp>\n\n<h2>ПРИМЕНИМОЕ ПРАВО И ПРОЧИЕ ПОЛОЖЕНИЯ<\u002Fh2>\n<p>К настоящему Соглашению применяется право [страна резидентства Разработчика], если иное не предусмотрено обязательными нормами страны вашего проживания.<\u002Fp>\n<p>Если какое-либо положение настоящего Соглашения признано недействительным, остальные положения сохраняют силу.<\u002Fp>\n\n<h2>СВЯЗЬ С НАМИ<\u002Fh2>\n<p>Если у вас есть вопросы или претензии по поводу настоящего Соглашения, свяжитесь с нами по адресу: [email разработчика].<\u002Fp>\n\n<\u002Fsection>\n\n<\u002Fmain>\n<\u002Fdiv>\n\n<footer>\n  <span>ACCELERATOS · 2026<\u002Fspan>\n  <a href=\"#\">Back to top ↑<\u002Fa>\n<\u002Ffooter>\n\n<script>\n(function () {\n  var sections = { ru: document.getElementById('ru'), en: document.getElementById('en') };\n  var labels = { ru: 'СОДЕРЖАНИЕ', en: 'CONTENTS' };\n  var chips = document.querySelectorAll('.chip');\n  var toc = document.getElementById('toc');\n  var tocTitle = document.getElementById('toc-title');\n  var links = [];\n\n  // Безопасность — карточкой, как экран правил в приложении\n  document.querySelectorAll('section ol').forEach(function (ol) {\n    var h = ol.previousElementSibling && ol.previousElementSibling.previousElementSibling;\n    if (h && h.tagName === 'H2' && /^(БЕЗОПАСНОСТЬ|SAFETY)$/.test(h.textContent.trim())) {\n      var box = document.createElement('div'); box.className = 'note';\n      ol.parentNode.insertBefore(box, ol); box.appendChild(ol);\n    }\n  });\n\n  function heads(lang) {\n    var list = Array.prototype.slice.call(sections[lang].querySelectorAll('h2'));\n    return lang === 'ru' ? list.slice(1) : list;\n  }\n  ['ru', 'en'].forEach(function (lang) {\n    heads(lang).forEach(function (h, i) { h.id = lang + '-' + (i + 1); });\n  });\n\n  function build(lang) {\n    toc.innerHTML = ''; links = [];\n    tocTitle.textContent = labels[lang];\n    heads(lang).forEach(function (h, i) {\n      var li = document.createElement('li');\n      var a = document.createElement('a');\n      a.href = '#' + h.id;\n      var n = document.createElement('span'); n.textContent = String(i + 1).padStart(2, '0');\n      a.appendChild(n); a.appendChild(document.createTextNode(h.textContent));\n      li.appendChild(a); toc.appendChild(li); links.push({ a: a, h: h });\n    });\n    chips.forEach(function (c) { c.setAttribute('aria-current', c.dataset.lang === lang ? 'true' : 'false'); });\n  }\n\n  var current = 'en';\n  build(current);\n\n  function onScroll() {\n    var lang = sections.ru.getBoundingClientRect().top < window.innerHeight * 0.4 ? 'ru' : 'en';\n    if (lang !== current) { current = lang; build(lang); }\n    var active = null;\n    links.forEach(function (l) { if (l.h.getBoundingClientRect().top < 140) active = l; });\n    links.forEach(function (l) { l.a.setAttribute('aria-current', l === active ? 'true' : 'false'); });\n  }\n  window.addEventListener('scroll', onScroll, { passive: true });\n  onScroll();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
